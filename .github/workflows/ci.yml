name: CI

# Builds DashPilot for an iOS simulator, runs the whole domain suite and the
# curated UI smoke journeys listed in .github/ui-smoke-journeys.txt. No signing,
# no archive, no Apple Developer account and no third-party CI service.
#
# The complete UI suite is not run here. It took 2h17m to 2h34m of a 2h28m to
# 2h54m job on every pull request (runs 36963445708 to 37088088371), which made
# feedback on a change slower than the change. It runs in ui-regression.yml on
# main, weekly, on release tags and on demand, unchanged in what it covers.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same branch or pull request, never runs on
# another ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test on iOS Simulator
    runs-on: macos-26
    # 2 to 4 minutes of build-for-testing and 5 to 8 of domain tests were
    # measured on this runner; the smoke journeys are about 35 seconds each
    # there, so about 20 minutes. 75 leaves room for a slow image without
    # approaching the full suite's budget. A ceiling for a hung run, not a
    # target.
    timeout-minutes: 75
    env:
      XCODE_PROJECT: DashPilot.xcodeproj
      XCODE_SCHEME: DashPilot

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Prepare an iOS simulator
        uses: ./.github/actions/prepare-simulator

      - name: Report the selected simulator
        run: echo "Building against $SIMULATOR_NAME ($SIMULATOR_ID)"

      - name: Build the app and both test bundles
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run the domain test suite (DashPilotTests)
        run: |
          set -euo pipefail

          rm -rf TestResults-Domain.xcresult

          xcodebuild test-without-building \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData \
            -only-testing:DashPilotTests \
            -resultBundlePath TestResults-Domain.xcresult

      - name: Run the UI smoke journeys (DashPilotUITests)
        run: |
          set -euo pipefail

          rm -rf TestResults-UI.xcresult

          # One -only-testing per listed journey; comments and blank lines are
          # ignored. An empty selection would run every journey, so refuse it.
          selection=()
          while IFS= read -r journey; do
            journey="${journey%%#*}"
            journey="$(echo "$journey" | tr -d '[:space:]')"
            [ -n "$journey" ] || continue
            selection+=("-only-testing:DashPilotUITests/DashPilotUITests/$journey")
          done < .github/ui-smoke-journeys.txt
          if [ "${#selection[@]}" -eq 0 ]; then
            echo "The smoke list selected no journeys." >&2
            exit 1
          fi
          echo "Running ${#selection[@]} smoke journeys."

          xcodebuild test-without-building \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData \
            "${selection[@]}" \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults-UI.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results
          path: |
            TestResults-Domain.xcresult
            TestResults-UI.xcresult
          if-no-files-found: ignore
