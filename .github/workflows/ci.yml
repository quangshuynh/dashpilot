name: CI

# Builds DashPilot for an iOS simulator and runs both test targets. No signing,
# no archive, no Apple Developer account and no third-party CI service.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same branch or pull request, never runs on
# another ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test on iOS Simulator
    runs-on: macos-26
    # The budget covers a whole run of both suites on a virtualised runner, and
    # it is measured rather than guessed. Run 35553963157 was cancelled by the
    # previous 60-minute budget with the UI journeys still executing: 3m25s of
    # build-for-testing, 5m43s of domain tests and 50m37s of UI journeys, in
    # which 87 of the 151 journeys had passed and none had failed. Finishing the
    # remaining journeys at that rate projects an 88-minute UI step and a job of
    # roughly 100 minutes, so 180 leaves most of a second run's worth of headroom
    # for a slow runner without approaching the 6-hour cap a GitHub-hosted job
    # has. It is a ceiling for a hung run, not a target: a healthy run finishes
    # well inside it, and the upload step below still runs when it is reached,
    # which that cancelled run demonstrated.
    timeout-minutes: 180
    env:
      XCODE_PROJECT: DashPilot.xcodeproj
      XCODE_SCHEME: DashPilot

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Select an Xcode that has the required iOS SDK
        run: |
          set -euo pipefail

          required="$(awk -F' = ' '/IPHONEOS_DEPLOYMENT_TARGET/ { gsub(/[; ]/, "", $2); print $2; exit }' "$XCODE_PROJECT/project.pbxproj")"
          if [ -z "$required" ]; then
            echo "Could not read IPHONEOS_DEPLOYMENT_TARGET from the project." >&2
            exit 1
          fi
          echo "Project deployment target: iOS $required"

          # True when $1 >= $2, comparing dotted versions.
          version_ge() { [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -n 1)" = "$2" ]; }

          best_app=""
          best_sdk=""
          for app in /Applications/Xcode*.app; do
            settings="$app/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk/SDKSettings.plist"
            [ -f "$settings" ] || continue
            sdk="$(/usr/libexec/PlistBuddy -c 'Print :Version' "$settings" 2>/dev/null || true)"
            [ -n "$sdk" ] || continue
            echo "  $app has iOS Simulator SDK $sdk"
            version_ge "$sdk" "$required" || continue
            if [ -z "$best_sdk" ] || version_ge "$sdk" "$best_sdk"; then
              best_app="$app"
              best_sdk="$sdk"
            fi
          done

          if [ -z "$best_app" ]; then
            echo "No installed Xcode provides an iOS Simulator SDK of at least $required." >&2
            exit 1
          fi

          echo "Using $best_app (iOS Simulator SDK $best_sdk)"
          echo "DEVELOPER_DIR=$best_app/Contents/Developer" >> "$GITHUB_ENV"
          echo "REQUIRED_IOS_VERSION=$required" >> "$GITHUB_ENV"

      - name: Show tool versions
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes ios

      - name: Choose an available iPhone simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > /tmp/simulators.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os, re

          required = tuple(int(part) for part in os.environ["REQUIRED_IOS_VERSION"].split("."))
          devices = json.load(open("/tmp/simulators.json"))["devices"]

          candidates = []
          for runtime, entries in devices.items():
              match = re.search(r"SimRuntime\.iOS-([0-9-]+)$", runtime)
              if not match:
                  continue
              version = tuple(int(part) for part in match.group(1).split("-"))
              if version < required:
                  continue
              for device in entries:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))

          if not candidates:
              raise SystemExit(
                  f"No available iPhone simulator on iOS {'.'.join(map(str, required))} or newer."
              )

          # Newest runtime first, then a plain "iPhone <n>" over a variant, then a
          # stable order by name, so the same runner image always picks the same
          # device without the workflow naming one.
          def preference(candidate):
              version, name, _ = candidate
              return (version, 1 if re.fullmatch(r"iPhone \d+", name) else 0, name)

          candidates.sort(key=preference, reverse=True)
          version, name, udid = candidates[0]
          print(f"SIMULATOR_NAME={name} (iOS {'.'.join(map(str, version))})")
          print(f"SIMULATOR_ID={udid}")
          PY

      - name: Report the selected simulator
        run: echo "Building against $SIMULATOR_NAME ($SIMULATOR_ID)"

      - name: Build the app and both test bundles
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run the domain test suite (DashPilotTests)
        run: |
          set -euo pipefail

          rm -rf TestResults-Domain.xcresult

          xcodebuild test-without-building \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData \
            -only-testing:DashPilotTests \
            -resultBundlePath TestResults-Domain.xcresult

      - name: Run the UI journeys (DashPilotUITests)
        run: |
          set -euo pipefail

          rm -rf TestResults-UI.xcresult

          xcodebuild test-without-building \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData \
            -only-testing:DashPilotUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults-UI.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results
          path: |
            TestResults-Domain.xcresult
            TestResults-UI.xcresult
          if-no-files-found: ignore
