name: CI

# Builds DashPilot for an iOS simulator, runs the whole domain suite and then
# the whole UI suite. No signing, no archive, no Apple Developer account and no
# third-party CI service.
#
# There is one tier. The UI suite is the essential journeys only (see
# docs/development/ui-suite-audit.md): everything a journey used to assert
# that a domain or integration test can pin is pinned there, so every pull
# request runs every journey and no second, larger suite exists to run later.
# It also runs weekly against main, so a runner image or simulator runtime
# change is noticed on a quiet week, on a release tag, and on demand.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    # Mondays 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch or pull request, never runs on
# another ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test on iOS Simulator
    runs-on: macos-26
    # 2 to 4 minutes of build-for-testing and 5 to 8 of domain tests were
    # measured on this runner. The 36 journeys took 2,377 s summed over their
    # median durations in the last four full runs of the old regression
    # workflow (37418449153 to 37614136154), about 40 minutes. 90 is a ceiling
    # for a hung run with room for the slowest of those runs, not a target.
    timeout-minutes: 90
    env:
      XCODE_PROJECT: DashPilot.xcodeproj
      XCODE_SCHEME: DashPilot

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Prepare an iOS simulator
        uses: ./.github/actions/prepare-simulator

      - name: Report the selected simulator
        run: echo "Building against $SIMULATOR_NAME ($SIMULATOR_ID)"

      - name: Build the app and both test bundles
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run the domain test suite (DashPilotTests)
        run: |
          set -euo pipefail

          rm -rf TestResults-Domain.xcresult

          xcodebuild test-without-building \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData \
            -only-testing:DashPilotTests \
            -resultBundlePath TestResults-Domain.xcresult

      - name: Run the UI journeys (DashPilotUITests)
        run: |
          set -euo pipefail

          rm -rf TestResults-UI.xcresult

          xcodebuild test-without-building \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath DerivedData \
            -only-testing:DashPilotUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults-UI.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results
          path: |
            TestResults-Domain.xcresult
            TestResults-UI.xcresult
          if-no-files-found: ignore
